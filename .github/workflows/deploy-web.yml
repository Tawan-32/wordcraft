name: deploy-web
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          path: craft-fonts
      - name: Add Thai fonts
        run: |
          mkdir -p craft-fonts/fonts/thai
          unzip -q -o ThaiFonts.zip -d craft-fonts/fonts/thai || true
          pip install fonttools
          python3 - <<'PY'
          import glob, os
          from fontTools.ttLib import TTFont
          lines = []
          for p in sorted(glob.glob("craft-fonts/fonts/thai/*.ttf")):
              f = TTFont(p, lazy=True)
              n = f["name"]
              def nm(i):
                  r = n.getName(i, 3, 1, 0x409) or n.getName(i, 1, 0, 0)
                  return r.toUnicode().strip() if r else ""
              fam, sty = nm(1), nm(2)
              if sty not in ("Regular", "Bold"):
                  continue
              rel = os.path.relpath(p, "craft-fonts")
              lines.append(f"{fam} | {sty} | {rel} | Thai")
          with open("craft-fonts/fonts/manifest.txt", "a", encoding="utf-8") as m:
              m.write("\n" + "\n".join(lines) + "\n")
          PY
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Build web
        working-directory: apps/wordcraft-web
        env:
