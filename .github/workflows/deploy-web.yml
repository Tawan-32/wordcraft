name: deploy-web
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Build web
        working-directory: apps/wordcraft-web
        run: trunk build --release --public-url "/${{ github.event.repository.name }}/"
      - name: Show output
        run: |
          ls -la apps/wordcraft-web
          find . -name "index.html" -not -path "./target/*" -not -path "*/node_modules/*" | head -20
          find . -name "*.wasm" -not -path "./target/*" | head -20
      - uses: actions/upload-pages-artifact@v3
        with:
              path: dist/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
